services:
  postgres:
    image: postgres:17-alpine
    container_name: resonanse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resonanse
    ports:
      - "5432:5432"
    volumes:
      - resonanse-pgdata:/var/lib/postgresql/data

volumes:
  resonanse-pgdata: